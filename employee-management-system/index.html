<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Employee Management System</h1>
        <p>Manage your employees easily</p>
    </header>

    <main>
        <section class="dashboard">
            <div class="card">
                <h3>Total Employees</h3>
                <p id="totalEmployees">0</p>
            </div>
            <div class="card">
                <h3>Departments</h3>
                <p id="totalDepartments">0</p>
            </div>
        </section>

        <section class="employee-form">
            <h2>Add Employee</h2>
            <form id="employeeForm">
                <input type="text" id="name" placeholder="Employee Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="department" placeholder="Department" required>
                <input type="text" id="position" placeholder="Position" required>
                <button type="submit">Add Employee</button>
            </form>
        </section>

        <section class="employee-list">
            <h2>Employee List</h2>
            <input type="text" id="search" placeholder="Search employee...">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Position</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTable"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Employee Management System © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
